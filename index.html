<!doctype html>

    <!-- Google tag (gtag.js) -->
    <!-- Google's required snippet, placed right after <head>. Tuned for 1stCars:
         - id="gtag-js" matches the dedup guard in src/lib/analytics.ts so the
           app never injects a second copy of the loader script.
         - Consent Mode v2 default is read from localStorage BEFORE the config
           call, preserving the app's opt-out model ("Turn Off" visitors are not
           tracked, including on their very next visit).
         - send_page_view:false keeps page_views exact — the app fires one
           page_view per SPA route change itself. -->
    <script async id="gtag-js" src="https://www.googletagmanager.com/gtag/js?id=G-2Z1JPEBR0R"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      (function(){
        var s = "granted";
        try { if (localStorage.getItem("1stcars_analytics_consent") === "denied") { s = "denied"; } } catch (e) {}
        gtag('consent', 'default', { ad_storage:s, ad_user_data:s, ad_personalization:s, analytics_storage:s, wait_for_update:500 });
      })();
      gtag('js', new Date());
      gtag('config', 'G-2Z1JPEBR0R', { send_page_view: false });
    </script>
